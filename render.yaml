services:
  - type: web
    name: Project-HR-Agent
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-render.txt &&
      python -c 'import torch; assert torch.__version__ == "2.14.0+cpu", torch.__version__; assert torch.version.cuda is None, torch.version.cuda; print("CPU-only PyTorch is ready")' &&
      python -m compileall app agent rag mcp_server mcp_client evaluation scripts &&
      python scripts/build_index.py --force &&
      python -c 'from rag.index import RagIndex; stats = RagIndex().stats(); assert stats["semantic_embeddings"] and stats["embedding_provider"] == "huggingface", stats; print("Hugging Face dense SQLite policy index is ready")'
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: MSAIE_MCP_TRANSPORT
        value: stdio
      - key: MSAIE_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MSAIE_LLM_FALLBACK_MODEL
        value: openrouter/free
      - key: MSAIE_LLM_API_KEY
        sync: false
      - key: MSAIE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MSAIE_INDEX_PATH
        value: .data/rag_index.sqlite3
