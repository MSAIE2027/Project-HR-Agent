services:
  - type: web
    name: msaie-hr-agent
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python -m compileall app agent rag mcp_server mcp_client evaluation scripts
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: MSAIE_MCP_TRANSPORT
        value: stdio
      - key: MSAIE_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MSAIE_LLM_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MSAIE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MSAIE_INDEX_PATH
        value: /tmp/msaie-rag/rag_index.sqlite3
