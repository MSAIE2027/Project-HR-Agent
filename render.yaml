services:
  - type: web
    name: Project-HR-Agent
    runtime: python
    plan: free
    branch: main
    buildCommand: >-
      python -m pip install -r requirements-render.txt &&
      python -m compileall app agent rag mcp_server mcp_client evaluation scripts &&
      python scripts/build_index.py --force &&
      python scripts/verify_pinned_index.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: MSAIE_MCP_TRANSPORT
        value: stdio
      - key: MSAIE_LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MSAIE_LLM_FALLBACK_MODEL
        value: openrouter/free
      - key: MSAIE_LLM_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_ZEN_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: OPENCODE_ZEN_MODELS
        value: nemotron-3.5-lightning-free,big-pickle,space-bunny-free
      - key: OPENCODE_ZEN_TIMEOUT_SECONDS
        value: "8"
      - key: MSAIE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MSAIE_INDEX_PATH
        value: .data/rag_index.sqlite3
